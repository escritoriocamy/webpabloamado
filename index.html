document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"ad29086a-c41b-40d2-9154-78598ddaa795\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"3145c5c2-379a-47e0-a046-37d3d4fe59e5\"><\u002Fscript>\n<style>\n  html { scroll-behavior: smooth; }\n  body { margin: 0; }\n  a { color: var(--color-accent); }\n  a:hover { color: var(--color-accent-700); }\n  .u-nav-link { text-decoration: none; color: var(--color-text); padding-bottom: 2px; border-bottom: 2px solid transparent; }\n  .u-nav-link:hover { color: var(--color-text); border-bottom-color: var(--color-accent); }\n  .u-cell { background: var(--color-bg); }\n  .u-lote { background: var(--color-bg); border: 2px solid var(--color-text); cursor: pointer; }\n  .u-lote:hover { background: var(--color-accent-100); }\n  .u-white-link { color: #f3f2f2; text-decoration: none; border-bottom: 2px solid var(--color-accent); }\n  .u-white-link:hover { color: #fff; }\n\n  /* — banda roja deslizante de pasos — */\n  .steps-band { overflow: hidden; position: relative; background: var(--color-accent); margin-left: -32px; margin-right: -32px; }\n  .steps-band::before, .steps-band::after {\n    content: \"\"; position: absolute; top: 0; bottom: 0; width: 48px; z-index: 2; pointer-events: none;\n  }\n  .steps-band::before { left: 0; background: linear-gradient(90deg, var(--color-accent), transparent); }\n  .steps-band::after { right: 0; background: linear-gradient(270deg, var(--color-accent), transparent); }\n  .steps-band-track {\n    display: flex; width: max-content;\n    animation: steps-band-scroll 26s linear infinite;\n  }\n  .steps-band:hover .steps-band-track { animation-play-state: paused; }\n  .steps-band-seq { display: flex; align-items: center; flex: none; }\n  .steps-band-item { display: flex; align-items: center; gap: 12px; padding: 18px 34px; flex: none; }\n  .steps-band-num {\n    font-family: var(--font-heading); font-weight: 800; font-size: 13px;\n    color: #fff; opacity: 0.62; letter-spacing: 0.02em;\n  }\n  .steps-band-label {\n    font-family: var(--font-heading); font-weight: 800; font-size: 14.5px;\n    letter-spacing: 0.01em; text-transform: uppercase; color: #fff; white-space: nowrap;\n  }\n  .steps-band-sep { color: rgba(255,255,255,0.5); font-size: 16px; flex: none; }\n  @keyframes steps-band-scroll {\n    from { transform: translateX(0); }\n    to { transform: translateX(-50%); }\n  }\n  @media (prefers-reduced-motion: reduce) {\n    .steps-band-track { animation: none; }\n  }\n\n  /* — responsive fixes: mobile — */\n  html, body { overflow-x: hidden; max-width: 100%; }\n  @media (max-width: 760px) {\n    .u-nav { display: none !important; }\n    .u-grid-stack { grid-template-columns: 1fr !important; gap: 20px !important; }\n    .u-grid-stack > p { max-width: none !important; }\n    .u-vender-grid { grid-template-columns: 1fr !important; }\n    .u-vender-aside { padding: 36px 24px 32px !important; }\n    .u-vender-form { padding: 32px 24px 40px !important; }\n    .u-footer-grid { grid-template-columns: 1fr !important; gap: 32px !important; }\n    header > div { padding-left: 20px !important; padding-right: 20px !important; gap: 16px !important; }\n    section, footer > div { padding-left: 20px !important; padding-right: 20px !important; }\n    .steps-band { margin-left: -20px !important; margin-right: -20px !important; }\n    /* the desktop grids give the 1st cell in a row 0 left-padding (it sits\n       flush against the row's own start) and every     <\u002Fnav>\n      <a class=\"btn btn-primary\" href=\"#subastas\" style=\"flex: none;\">Ver subastas<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"max-width: 1240px; margin: 0 auto; padding: 72px 32px 0;\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 28px;\">\n      <span style=\"width: 40px; height: 2px; background: var(--color-accent);\"><\u002Fspan>\n      <span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700);\">Remates y liquidación de galpones<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-size: clamp(52px, 9.5vw, 132px); line-height: 0.88; letter-spacing: -0.04em; text-transform: uppercase; margin: 0;\">Del galpón<br>al <span style=\"color: var(--color-accent);\">comprador.<\u002Fspan><\u002Fh1>\n    <div class=\"u-grid-stack\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: end; margin-top: 40px;\">\n      <p style=\"max-width: 46ch; font-size: 17px; line-height: 1.6; margin: 0; color: var(--color-neutral-800);\">Limpiamos, clasificamos, tasamos y publicamos lo que tenés guardado. Vos liberás el espacio, nosotros encontramos el valor que hay adentro.<\u002Fp>\n      <div style=\"display: flex; gap: 12px; flex-wrap: wrap;\">\n        <a class=\"btn btn-primary\" href=\"#vender\" style=\"padding: 14px 22px; font-size: 15px;\">Vender mis bienes<\u002Fa>\n        <a class=\"btn btn-secondary\" href=\"#subastas\" style=\"padding: 14px 22px; font-size: 15px; border-width: 2px; border-color: var(--color-text);\">Ver subastas<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top: 64px; border-top: 2px solid var(--color-text); display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 2px; background: var(--color-divider);\">\n      <div class=\"u-cell\" style=\"padding: 20px 0 0;\"><div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 20px; letter-spacing: -0.02em;\">Limpieza<\u002Fdiv><div style=\"font-size: 13px; color: var(--color-neutral-700);\">y clasificación en el lugar<\u002Fdiv><\u002Fdiv>\n      <div class=\"u-cell\" style=\"padding: 20px 0 0 20px;\"><div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 20px; letter-spacing: -0.02em;\">Tasación<\u002Fdiv><div style=\"font-size: 13px; color: var(--color-neutral-700);\">orientativa sin cargo<\u002Fdiv><\u002Fdiv>\n      <div class=\"u-cell\" style=\"padding: 20px 0 0 20px;\"><div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 20px; letter-spacing: -0.02em;\">Subasta pública<\u002Fdiv><div style=\"font-size: 13px; color: var(--color-neutral-700);\">con seguimiento del proceso<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"como-trabajamos\" style=\"max-width: 1240px; margin: 0 auto; padding: 80px 32px;\">\n    <div class=\"u-grid-stack\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 40px; align-items: end; border-bottom: 2px solid var(--color-text); padding-bottom: 24px; margin-bottom: 2px;\">\n      <div>\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 10px;\">Cómo trabajamos<\u002Fdiv>\n        <h2 style=\"font-size: clamp(32px, 4vw, 52px); line-height: 0.95; letter-spacing: -0.03em; text-transform: uppercase; margin: 0;\">Siete pasos,<br>de punta a punta<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font-size: 16px; line-height: 1.6; margin: 0; color: var(--color-neutral-800); max-width: 42ch;\">Vos nos avisás qué tenés. Nosotros nos encargamos del resto.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 2px; background-color: #F3F2F2\">\n      <div class=\"u-cell\" style=\"padding: 24px 24px 28px 0; display: flex; flex-direction: column; gap: 8px; min-height: 190px;\">\n        <span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: var(--color-accent);\">01<\u002Fspan>\n        <h3 style=\"font-size: 22px; letter-spacing: -0.02em; margin: 0;\">Limpieza del galpón<\u002Fh3>\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.5; color: var(--color-neutral-700);\">Retiramos, ordenamos y separamos los bienes en el lugar.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"u-cell\" style=\"padding: 24px 24px 28px; display: flex; flex-direction: column; gap: 8px; min-height: 190px;\">\n        <span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: var(--color-accent);\">02<\u002Fspan>\n        <h3 style=\"font-size: 22px; letter-spacing: -0.02em; margin: 0;\">Clasificación<\u002Fh3>\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.5; color: var(--color-neutral-700);\">Separamos lo que puede venderse, reciclarse o descartarse.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"u-cell\" style=\"padding: 24px 24px 28px; display: flex; flex-direction: column; gap: 8px; min-height: 190px;\">\n        <span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: var(--color-accent);\">03<\u002Fspan>\n        <h3 style=\"font-size: 22px; letter-spacing: -0.02em; margin: 0;\">Tasación<\u002Fh3>\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.5; color: var(--color-neutral-700);\">Determinamos un valor orientativo de los artículos comercializables.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"u-cell\" style=\"padding: 24px 24px 28px; display: flex; flex-direction: column; gap: 8px; min-height: 190px;\">\n        <span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: var(--color-accent);\">04<\u002Fspan>\n        <h3 style=\"font-size: 22px; letter-spacing: -0.02em; margin: 0;\">Registro fotográfico<\u002Fh3>\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.5; color: var(--color-neutral-700);\">Fotografiamos y documentamos cada lote.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"u-cell\" style=\"padding: 24px 24px 28px 0; display: flex; flex-direction: column; gap: 8px; min-height: 190px;\">\n        <span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: var(--color-accent);\">05<\u002Fspan>\n        <h3 style=\"font-size: 22px; letter-spacing: -0.02em; margin: 0;\">Publicación<\u002Fh3>\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.5; color: var(--color-neutral-700);\">Los artículos se publican con descripción, fotografías y condiciones.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"u-cell\" style=\"padding: 24px 24px 28px; display: flex; flex-direction: column; gap: 8px; min-height: 190px;\">\n        <span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: var(--color-accent);\">06<\u002Fspan>\n        <h3 style=\"font-size: 22px; letter-spacing: -0.02em; margin: 0;\">Subasta<\u002Fh3>\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.5; color: var(--color-neutral-700);\">Los interesados realizan sus ofertas durante el período establecido.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"u-cell\" style=\"padding: 24px 24px 28px; display: flex; flex-direction: column; gap: 8px; min-height: 190px;\">\n        <span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: var(--color-accent);\">07<\u002Fspan>\n        <h3 style=\"font-size: 22px; letter-spacing: -0.02em; margin: 0;\">Adjudicación y entrega<\u002Fh3>\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.5; color: var(--color-neutral-700);\">Se informa al ganador y se coordina el pago y el retiro.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"steps-band\" style=\"margin-top: 40px;\">\n      <div class=\"steps-band-track\">\n        <div class=\"steps-band-seq\">\n          <div class=\"steps-band-item\"><span class=\"steps-band-num\">01<\u00 a y te decimos qué servicio corresponde — sin compromiso.<\u002Fp>\n          <\u002Fdiv>\n          <a href=\"https://wa.me/59899171810?text=Hola%2C%20quiero%20vender%20mis%20bienes\" target=\"_blank\" rel=\"noopener\" style=\"color: #fff; text-decoration: none; font-family: var(--font-heading); font-weight: 800; font-size: 18px; letter-spacing: -0.01em; border-top: 2px solid rgba(255,255,255,.5); padding-top: 16px;\">099 171 810 — hablar por WhatsApp →<\u002Fa>\n        <\u002Fdiv>\n        <form class=\"u-vender-form\" sc-camel-on-submit=\"{{ enviarVenta }}\" style=\"padding: 56px 0 48px 48px; display: flex; flex-direction: column; gap: 16px;\">\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px;\">\n            <div class=\"field\"><label for=\"v-nombre\">Nombre<\u002Flabel><input class=\"input\" type=\"text\" id=\"v-nombre\" name=\"nombre\" required=\"{{ true }}\"><\u002Fdiv>\n            <div class=\"field\"><label for=\"v-telefono\">Teléfono<\u002Flabel><input class=\"input\" type=\"tel\" id=\"v-telefono\" name=\"telefono\" required=\"{{ true }}\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"field\"><label for=\"v-localidad\">Localidad<\u002Flabel><input class=\"input\" type=\"text\" id=\"v-localidad\" name=\"localidad\" required=\"{{ true }}\" placeholder=\"San José de Mayo, Santa Lucía...\"><\u002Fdiv>\n          <div class=\"field\"><label for=\"v-que\">¿Qué necesitás limpiar?<\u002Flabel><input class=\"input\" type=\"text\" id=\"v-que\" name=\"que\" required=\"{{ true }}\" placeholder=\"Galpón, casa, depósito, campo...\"><\u002Fdiv>\n          <div class=\"field\"><label for=\"v-donde\">¿Dónde se encuentra?<\u002Flabel><input class=\"input\" type=\"text\" id=\"v-donde\" name=\"donde\" required=\"{{ true }}\" placeholder=\"Dirección o zona\"><\u002Fdiv>\n          <div style=\"border-left: 2px solid var(--color-accent); background: var(--color-accent-100); padding: 12px 16px; font-siz 0;\"><div style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-700);\">Ubicación<\u002Fdiv><div style=\"font-size: 15px; font-weight: 600;\">{{ detalle.ubicacion }}<\u002Fdiv><\u002Fdiv>\n                <div class=\"u-cell\" style=\"padding: 14px;\"><div style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-700);\">Estado<\u002Fdiv><div style=\"font-size: 15px; font-weight: 600;\">{{ detalle.estado }}<\u002Fdiv><\u002Fdiv>\n                <div class=\"u-cell\" style=\"padding: 14px;\"><div style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-700);\">Cierra<\u002Fdiv><div style=\"font-size: 15px; font-weight: 600;\">{{ detalle.cierreTexto }}<\u002Fdiv><\u002Fdiv>\n                <div class=\"u-cell\" style=\"padding: 14px;\"><div style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-700);\">Comisión comprador<\u002Fdiv><div style=\"font-size: 15px; font-weight: 600;\">{{ detalle.comisionComprador }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-top: 24px; border-bottom: 2px solid var(--color-text); padding-bottom: 12px;\">\n                <span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-neutral-700);\">Oferta actual<\u002Fspan>\n                <span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 34px; letter-spacing: -0.03em; color: var(--color-accent);\">{{ detalle.ofertaTexto }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"max-height: 180px; overflow-y: auto; margin-top: 12px;\">\n                <sc-for list=\"{{ ofertas }}\" as=\"o\" hint-placeholder-count=\"0\">\n                  <div style=\"display: flex; justify-content: space-between; font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--color-divider); color: var(--color-neutral-800);\">\n                    <span>{{ o.nombre }}<\u002Fspan><span style=\"font-weight: 600;\">{{ o.montoTexto }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ sinOfertas }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size: 14px; padding: 8px 0; color: var(--color-neutral-700);\">Todavía no hay ofertas — ¡sé el primero!<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <form sc-camel-on-submit=\"{{ enviarOferta }}\" style=\"margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; align-items: end;\">\n                <input class=\"input\" type=\"text\" name=\"nombre\" placeholder=\"Tu nombre\" required=\"{{ true }}\">\n                <input class=\"input\" type=\"tel\" name=\"telefono\" placeholder=\"Tu teléfono\" required=\"{{ true }}\">\n                <input class=\"input\" type=\"number\" name=\"monto\" placeholder=\"Tu oferta ($)\" min=\"{{ montoMinimo }}\" required=\"{{ true }}\">\n                <button type=\"submit\" class=\"btn btn-primary\" disabled=\"{{ ofertaEnviando }}\" style=\"padding: 10px 18px; justify-content: flex-start;\">{{ ofertaBtnTexto }}<\u002Fbutton>\n              <\u002Fform>\n              <sc-if value=\"{{ ofertaMsg }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size: 14px; margin-top: 10px; color: {{ ofertaMsgColor }};\">{{ ofertaMsg }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}\">\nconst ENDPOINT = \"https://script.google.com/macros/s/AKfycbxR3x-li2wv0PFMES_p1uWnub4FozSSVveRnpn3ew0vkVFP14gN13S39zoHi4FEnhtL/exec\";\n\nfunction fmtMoneda(n) { return '$' + Number(n || 0).toLocaleString('es-UY'); }\nfunction fmtFechaHora(iso) {\n  if (!iso) return '';\n  const d = new Date(iso);\n  if (isNaN(d)) return String(iso);\n  return d.toLocaleDateString('es-UY') + ' – ' + d.toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' });\n}\nfunction youtubeEmbedUrl(valor) {\n  if (!valor) return '';\n  valor = String(valor).trim();\n  if (!valor) return '';\n  let id = null;\n  let m;\n  if ((m = valor.match(/youtu\\.be\\/([a-zA-Z0-9_-]{6,})/))) id = m[1];\n  else if ((m = valor.match(/[?&]v=([a-zA-Z0-9_-]{6,})/))) id = m[1];\n  else if ((m = valor.match(/youtube\\.com\\/embed\\/([a-zA-Z0-9_-]{6,})/))) id = m[1];\n  else if ((m = valor.match(/youtube\\.com\\/shorts\\/([a-zA-Z0-9_-]{6,})/))) id = m[1];\n  else if (/^[a-zA-Z0-9_-]{6,}$/.test(valor)) id = valor;\n  if (!id) return '';\n  return 'https://www.youtube.com/embed/' + id;\n}\n\nclass Component extends DCLogic {\n  state = {\n    lotes: [], lotesEstado: 'Cargando lotes…',\n    ventaEnviando: false, ventaMsg: '', ventaOk: false,\n    modalId: null, detalle: null, ofertas: [], detalleEstado: 'Cargando…',\n    ofertaEnviando: false, ofertaMsg: '', ofertaOk: false\n  };\n\n  componentDidMount() { this.cargarLotes(); }\n  componentWillUnmount() { clearInterval(this.timer); }\n\n  async cargarLotes() {\n    try {\n      const resp = await fetch(ENDPOINT + '?lotes=1&_=' + Date.now(), { cache: 'no-store' });\n      const data = await resp.json();\n      const lotes = (data && data.lotes) || [];\n      if (!lotes.length) { this.setState({ lotes: [], lotesEstado: 'No hay lotes activos por el momento. Volvé a mirar pronto.' }); return; }\n      this.setState({ lotes });\n    } catch (err) {\n      this.setState({ lotes: [], lotesEstado: 'No pudimos cargar los lotes. Probá de nuevo en un rato.' });\n    }\n  }\n\n  async enviarVenta(e) {\n    e.preventDefault();\n    const form = e.target;\n    const fd = new FormData(form);\n    this.setState({ ventaEnviando: true, ventaMsg: '' });\n    const datos = {\n      tipo: 'venta',\n      enviado: new Date().toLocaleString('sv-SE', { timeZone: 'America/Montevideo' }),\n      nombre: (fd.get('nombre') || '').trim(),\n      telefono: (fd.get('telefono') || '').trim(),\n      localidad: (fd.get('localidad') || '').trim(),\n      que: (fd.get('que') || '').trim(),\n      donde: (fd.get('donde') || '').trim(),\n      comentarios: (fd.get('comentarios') || '').trim()\n    };\n    try {\n      const resp = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(datos) });\n      const data = await resp.json();\n      if (!data.ok) throw new Error('no guardado');\n      form.reset();\n      this.setState({ ventaOk: true, ventaMsg: '¡Listo! Recibimos tu solicitud, te contactamos para coordinar una visita.' });\n    } catch (err) {\n      this.setState({ ventaOk: false, ventaMsg: 'No pudimos enviarlo. Probá de nuevo o escribinos por WhatsApp.' });\n    } finally {\n      this.setState({ ventaEnviando: false });\n    }\n  }\n\n  abrirLote(id) {\n    this.setState({ modalId: id, detalle: null, ofertas: [], detalleEstado: 'Cargando…', ofertaMsg: '' });\n    this.cargarDetalle(id);\n    clearInterval(this.timer);\n    this.timer = setInterval(() => this.cargarDetalle(id), 6000);\n  }\n\n  cerrarModal() {\n    clearInterval(this.timer);\n    this.setState({ modalId: null, detalle: null, ofertas: [] });\n  }\n\n  async cargarDetalle(id) {\n    try {\n      const resp = await fetch(ENDPOINT + '?lote=1&id=' + encodeURIComponent(id) + '&_=' + Date.now(), { cache: 'no-store' });\n      const data = await resp.json();\n      if (!data.lote) { this.setState({ detalle: null, detalleEstado: 'No encontramos este lote.' }); return; }\n      this.setState({ detalle: data.lote, ofertas: data.ofertas || [] });\n    } catch (err) {\n      this.setState({ detalle: null, detalleEstado: 'No pudimos cargar este lote. Probá de nuevo.' });\n    }\n  }\n\n  async enviarOferta(e) {\n    e.preventDefault();\n    const form = e.target;\n    const fd = new FormData(form);\n    const id = this.state.modalId;\n    this.setState({ ofertaEnviando: true, ofertaMsg: '' });\n    try {\n      const resp = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({\n        tipo: 'oferta', loteId: id,\n        nombre: (fd.get('nombre') || '').trim(),\n        telefono: (fd.get('telefono') || '').trim(),\n        monto: Number(fd.get('monto')),\n        enviado: new Date().toLocaleString('sv-SE', { timeZone: 'America/Montevideo' })\n      })});\n      const data = await resp.json();\n      if (!data.ok) {\n        this.setState({ ofertaOk: false, ofertaMsg: data.error === 'monto_bajo' ? 'Tu oferta tiene que ser mayor a la actual.' : 'No pudimos registrar tu oferta.' });\n      } else {\n        this.setState({ ofertaOk: true, ofertaMsg: '¡Oferta registrada!' });\n        form.reset();\n        this.cargarDetalle(id);\n      }\n    } catch (err) {\n      this.setState({ ofertaOk: false, ofertaMsg: 'No pudimos conectar. Probá de nuevo.' });\n    } finally {\n      this.setState({ ofertaEnviando: false });\n    }\n  }\n\n  renderVals() {\n    const s = this.state;\n    const d = s.detalle;\n    const base = d ? (d.ofertaActual || d.precioBase || 0) : 0;\n    return {\n      lotes: s.lotes.map(l => ({\n        ...l,\n        tieneFoto: !!l.fotoPrincipal,\n        sinFoto: !l.fotoPrincipal,\n        ubicacion: l.ubicacion || '',\n        ofertaTexto: fmtMoneda(l.ofertaActual || l.precioBase),\n        cierreTexto: fmtFechaHora(l.cierre),\n        abrir: () => this.abrirLote(l.id)\n      })),\n      sinLotes: s.lotes.length === 0,\n      lotesEstado: s.lotesEstado,\n\n      ventaEnviando: s.ventaEnviando,\n      ventaBtnTexto: s.ventaEnviando ? 'Enviando…' : 'Solicitar evaluación',\n      ventaMsg: s.ventaMsg,\n      ventaMsgColor: s.ventaOk ? 'var(--color-neutral-800)' : 'var(--color-accent-700)',\n      enviarVenta: (e) => this.enviarVenta(e),\n\n      modalAbierto: s.modalId !== null,\n      detalleId: s.modalId,\n      detalleCargando: !d,\n      detalleListo: !!d,\n      detalleEstado: s.detalleEstado,\n      detalle: d ? {\n        titulo: d.titulo || '',\n        descripcion: d.descripcion || '',\n        ubicacion: d.ubicacion || '—',\n        estado: d.estado || '—',\n        cierreTexto: fmtFechaHora(d.cierre) || '—',\n        comisionComprador: d.comisionComprador || '—',\n        ofertaTexto: fmtMoneda(base),\n        fotoPrincipal: d.fotoPrincipal || '',\n        tieneFoto: !!d.fotoPrincipal,\n        videoEmbed: youtubeEmbedUrl(d.video),\n        tieneVideo: !!youtubeEmbedUrl(d.video),\n        mostrarFoto: !!d.fotoPrincipal && !youtubeEmbedUrl(d.video)\n      } : null,\n      ofertas: s.ofertas.map(o => ({ nombre: o.nombre, montoTexto: fmtMoneda(o.monto) })),\n      sinOfertas: !!d && s.ofertas.length === 0,\n      montoMinimo: base + 1,\n      ofertaEnviando: s.ofertaEnviando,\n      ofertaBtnTexto: s.ofertaEnviando ? 'Enviando…' : 'Ofertar',\n      ofertaMsg: s.ofertaMsg,\n      ofertaMsgColor: s.ofertaOk ? 'var(--color-neutral-800)' : 'var(--color-accent-700)',\n      enviarOferta: (e) => this.enviarOferta(e),\n      cerrarModal: () => this.cerrarModal(),\n      cerrarFondo: (e) => { if (e.target === e.currentTarget) this.cerrarModal(); },\n      stop: (e) => e.stopPropagation()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
